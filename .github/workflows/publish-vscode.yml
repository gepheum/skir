name: "Publish VS Code Extension"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build required workspace packages
        run: |
          npm run build --workspace=skir-internal
          npm run build --workspace=skir
          npm run build --workspace=skir-language-server
          npm run bundle --workspace=skir-lang

      - name: Publish to Visual Studio Marketplace (Trusted Publishing / OIDC)
        working-directory: packages/vscode
        run: npx @vscode/vsce publish --no-dependencies --oidc
