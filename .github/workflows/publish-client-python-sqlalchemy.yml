name: "Publish Client: Python SQLAlchemy (skir-sqlalchemy)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-libraries/python-sqlalchemy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: client-libraries/python-sqlalchemy/dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
