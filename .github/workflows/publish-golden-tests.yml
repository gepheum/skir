name: "Publish Golden Tests (Mirror skir-golden-tests)"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to push to gepheum/skir-golden-tests"
        required: true
        type: string

jobs:
  sync-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync golden-tests to gepheum/skir-golden-tests
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${MIRROR_TOKEN}@github.com/gepheum/skir-golden-tests.git" /tmp/mirror
          rsync -a --delete --exclude='.git' golden-tests/ /tmp/mirror/
          cd /tmp/mirror
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync golden-tests ${TAG} from gepheum/skir monorepo"
          fi
          git tag -f "${TAG}"
          git push origin HEAD:main --tags -f
