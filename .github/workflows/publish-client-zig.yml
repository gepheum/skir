name: "Publish Client: Zig (Mirror skir-zig-client)"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to push to gepheum/skir-zig-client (e.g. v1.0.5)"
        required: true
        type: string

jobs:
  sync-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync client-libraries/zig to gepheum/skir-zig-client
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${MIRROR_TOKEN}@github.com/gepheum/skir-zig-client.git" /tmp/mirror
          rsync -a --delete --exclude='.git' client-libraries/zig/ /tmp/mirror/
          cd /tmp/mirror
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync Zig client ${TAG} from gepheum/skir monorepo"
          fi
          git tag -f "${TAG}"
          git push origin HEAD:main --tags -f
