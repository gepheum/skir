name: "Publish Client: Ruby (RubyGems)"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-libraries/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          working-directory: client-libraries/ruby
      - name: Install dependencies, run tests, and Sorbet typecheck
        run: |
          bundle install
          bundle exec rake test
          bundle exec srb tc
      - name: Configure RubyGems Credentials (Trusted Publishing)
        uses: rubygems/configure-rubygems-credentials@v2.2.0
      - name: Build and publish gem to RubyGems
        run: |
          gem build skir-client.gemspec
          gem push skir-client-*.gem
