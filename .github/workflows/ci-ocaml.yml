name: "CI: OCaml"

on:
  workflow_dispatch:

jobs:
  ci-ocaml:
    name: Verify OCaml Client & E2E Tests
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install OCaml and Dune
        run: |
          sudo apt-get update
          sudo apt-get install -y ocaml dune
      - name: Install & build Skir compiler
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - name: Verify OCaml client library unit tests
        working-directory: client-libraries/ocaml
        run: |
          ./pre_commit.sh
      - name: Verify OCaml E2E & Golden test suite
        run: |
          ./e2e-tests/test.sh --lang=ocaml
