name: "CI: F#"

on:
  workflow_dispatch:

jobs:
  ci-fsharp:
    name: Verify F# E2E Tests
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install & build Skir compiler
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - name: Verify F# E2E tests formatting & test suite
        run: |
          ./e2e-tests/test.sh --lang=fsharp
