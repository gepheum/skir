name: "Publish Client: C# (NuGet)"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-libraries/csharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SkirClient.csproj
      - name: Build
        run: dotnet build SkirClient.csproj -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test SkirClientTest/SkirClientTest.csproj -c Release --no-build
      - name: Pack
        run: dotnet pack SkirClient.csproj -c Release --no-build -o artifacts
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: gepheum
      - name: Publish to NuGet
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
