name: CI

on:
  workflow_dispatch:

jobs:
  node:
    name: Build & Test TypeScript Workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm test
      - run: ./e2e-tests/test.sh --lang=typescript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
