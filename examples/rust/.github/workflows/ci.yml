name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Skir formatting
        run: npx -y skir format --ci

      - name: Run Skir-to-Rust codegen
        run: npx -y skir gen

      - name: Build and run snippets
        run: |
          cargo clippy -- -D warnings
          cargo build
          cargo run --bin snippets
